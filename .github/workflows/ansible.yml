name: Ansible (déploiement Ubuntu)

on:
  push:
    branches: [main]
    paths: ['ansible/**', 'Dockerfile', 'BoutiqueTech/**', '.github/workflows/ansible.yml']
  pull_request:
    branches: [main]
    paths: ['ansible/**', 'Dockerfile', 'BoutiqueTech/**', '.github/workflows/ansible.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: ansible

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer Ansible et ansible-lint
        run: pip install --quiet ansible-core ansible-lint

      - name: Installer les collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint (profil production)
        run: ansible-lint --profile production deploy.yml

  deploy-test:
    name: Déploiement de test sur Ubuntu
    runs-on: ubuntu-latest
    needs: lint
    env:
      APP_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Installer Ansible
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Préparer l'inventaire local
        run: |
          printf '[boutiquetech]\nlocalhost ansible_connection=local\n' > inventory.ini
          # Le runner GitHub déclare déjà le dépôt Docker avec une autre clé
          sudo rm -f /etc/apt/sources.list.d/docker*.list /etc/apt/sources.list.d/docker*.sources

      - name: Déploiement
        run: >-
          ansible-playbook deploy.yml
          -e app_version=$APP_VERSION
          -e system_upgrade=false

      - name: Vérification de l'idempotence (second passage sans changement)
        run: |
          ansible-playbook deploy.yml -e app_version=$APP_VERSION -e system_upgrade=false | tee second-run.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' second-run.log

      - name: Test de bout en bout via nginx
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://localhost/
          curl -fsSI http://localhost/ | grep -i "x-content-type-options: nosniff"
          docker ps --filter name=boutiquetech
