version: 2
updates:
  - package-ecosystem: nuget
    directory: /BoutiqueTech
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Le projet cible .NET 8 (LTS) : pas de montée de version majeure automatique
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
