---
- name: Installer nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Désactiver le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

- name: Déployer la configuration du reverse proxy
  ansible.builtin.template:
    src: boutiquetech.conf.j2
    dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Recharger nginx

- name: Activer le site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ app_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
    state: link
  notify: Recharger nginx

- name: Valider la configuration nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Démarrer nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Appliquer les changements de configuration
  ansible.builtin.meta: flush_handlers

- name: Vérifier que le site répond via nginx
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
